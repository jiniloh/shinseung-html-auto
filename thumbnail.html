<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>유튜브 썸네일 생성기 · 신승교회</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="thumbnail.css"/>
<link rel="stylesheet" href="nav.css"/>
</head>
<body>
<nav class="site-nav" aria-label="도구 전환">
  <div class="site-nav-inner">
    <a class="site-brand" href="index.html"><img src="assets/logo.png" alt=""/><span>신승교회</span></a>
    <div class="site-tabs">
      <a class="site-tab" href="index.html">성경 본문</a>
      <a class="site-tab is-active" href="thumbnail.html" aria-current="page">썸네일</a>
    </div>
  </div>
</nav>
<main class="thumb-app">
  <section class="control-panel" aria-labelledby="toolTitle">
    <header class="tool-head">
      <h1 id="toolTitle">유튜브 썸네일 생성기</h1>
      <p>신승교회 예배 영상용 1280×720 PNG</p>
    </header>

    <div class="field">
      <label for="servicePreset">예배 선택</label>
      <select id="servicePreset">
        <option value="sunday">주일대예배</option>
        <option value="evening">주일저녁예배</option>
        <option value="samil">삼일예배</option>
      </select>
    </div>

    <div class="field">
      <label for="serviceName">예배명</label>
      <input id="serviceName" type="text" value="주일대예배"/>
    </div>

    <div class="field two-col">
      <div>
        <label for="dateInput">날짜</label>
        <input id="dateInput" type="date" value="2025-05-25"/>
      </div>
      <div>
        <label for="referenceInput">말씀 본문</label>
        <input id="referenceInput" type="text" value="출애굽기 10장 21-23절"/>
      </div>
    </div>

    <div class="field">
      <label for="titleInput">제목</label>
      <textarea id="titleInput" rows="3">항상 빛이 있었더라</textarea>
    </div>

    <div class="field">
      <label for="fileNameInput">파일명</label>
      <input id="fileNameInput" type="text" value="신승교회_주일대예배_썸네일.png"/>
    </div>

    <div class="actions">
      <button class="btn primary" id="downloadBtn" type="button">
        <span aria-hidden="true">↓</span>
        PNG 다운로드
      </button>
      <button class="btn secondary" id="copyBtn" type="button">
        <span aria-hidden="true">⧉</span>
        클립보드 복사
      </button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="preview-panel" aria-label="썸네일 미리보기">
    <div class="canvas-shell">
      <canvas id="thumbCanvas" width="1280" height="720"></canvas>
    </div>
  </section>
</main>

<script src="thumbnail.js"></script>
</body>
</html>
